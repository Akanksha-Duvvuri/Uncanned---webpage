  <style>
    :root {
      --color-green:  #26422B;
      --color-orange: #BD6537;
      --color-cream:  #FFEDBB;
      --color-beige:  #E0B281;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background-color: var(--color-green);
      background-image: linear-gradient(180deg, #2E4C33 0%, #26422B 50%, #1E3522 100%);
      color: var(--color-cream);
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      overflow: hidden;
    }

    .bloom {
      position: fixed;
      pointer-events: none;
      filter: blur(120px);
      border-radius: 50%;
      z-index: 0;
    }
    .bloom-1 {
      top: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(224, 178, 129, 0.14) 0%, rgba(224, 178, 129, 0) 70%);
    }
    .bloom-2 {
      bottom: -14%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(189, 101, 55, 0.10) 0%, rgba(189, 101, 55, 0) 72%);
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 90% 78% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.2) 100%);
    }

    .inner {
      position: relative;
      z-index: 1;
      max-width: 420px;
    }

    .stamp {
      display: inline-block;
      width: 88px;
      transform: rotate(-10deg);
      margin-bottom: 36px;
      opacity: 0;
      animation: stampIn 620ms cubic-bezier(0.34, 1.56, 0.64, 1) 120ms both;
    }
    .stamp svg { width: 100%; display: block; }
    .stamp svg path { fill: var(--color-cream); }

    @keyframes stampIn {
      0%   { transform: rotate(-18deg) translateY(-14px); opacity: 0; }
      60%  { transform: rotate(-8deg)  translateY(2px);   opacity: 1; }
      100% { transform: rotate(-10deg) translateY(0);     opacity: 1; }
    }

    h1 {
      font-family: 'Georgia', serif;
      font-weight: 400;
      font-size: clamp(54px, 12vw, 96px);
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--color-cream);
      margin-bottom: 16px;
    }

    .four-o-four {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 237, 187, 0.45);
      margin-bottom: 14px;
    }

    p.whisper {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1.6;
      color: rgba(255, 237, 187, 0.7);
      margin-bottom: 40px;
      max-width: 32ch;
      margin-left: auto;
      margin-right: auto;
    }

    a.home {
      display: inline-flex;
      align-items: center;
      padding: 13px 28px;
      border: 1.5px solid var(--color-cream);
      border-radius: 100px;
      color: var(--color-cream);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      transition: background-color 280ms ease, color 280ms ease;
    }
    a.home:hover,
    a.home:focus-visible {
      background-color: var(--color-cream);
      color: var(--color-green);
      outline: none;
    }
    a.home:focus-visible {
      outline: 2px solid var(--color-orange);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .stamp { animation: none; opacity: 1; transform: rotate(-10deg); }
    }
  </style>
</head>
